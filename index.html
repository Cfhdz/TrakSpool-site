<html lang="en">

    <meta name="author" content="TrakSpool" />
    <meta name="robots" content="index, follow" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171411" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3eee3" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trakspool.com/" />
    <meta name="twitter:title" content="TrakSpool — Open-Source Filament Inventory System" />
    <meta name="twitter:description" content="An open-source spool scale and NFC tag reader that identifies every spool and tracks what is left. Build your own: open firmware, apps, enclosure and PCB files." />
    <meta name="twitter:image" content="https://trakspool.com/og-image.png" />
    
    <!-- First paint: put the theme class on <html> before the stylesheet renders, the same way
         src/context/ThemeProvider.jsx does once React has mounted (same storage key and shape
         as the admin console: localStorage "trakspool-settings" = { theme }). A stored choice
         wins; with none, follow the system. -->
    <script>
      (function () {
        var theme = null;
        try {
          var saved = JSON.parse(localStorage.getItem("trakspool-settings") || "null");
          if (saved && (saved.theme === "light" || saved.theme === "dark")) theme = saved.theme;
        } catch (e) {
          theme = null;
        }
        if (!theme) {
          try {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          } catch (e) {
            theme = "dark";
          }
        }
        document.documentElement.classList.add(theme + "-mode");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
